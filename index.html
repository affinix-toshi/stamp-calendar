<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スタンプカレンダー</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
            background: #f0f0f5;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 14px 16px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(108,92,231,0.4);
        }
        .header h1 { font-size: 17px; font-weight: bold; }
        .header-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
        .share-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .share-btn:active { background: rgba(255,255,255,0.4); }
        .settings-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .settings-btn:active { background: rgba(255,255,255,0.4); }

        /* 参加者バッジ */
        .members-bar {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: white;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
            flex-wrap: wrap;
            min-height: 36px;
        }
        .member-badge {
            background: #6c5ce7;
            color: white;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 11px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .member-badge.me { background: #00b894; }

        /* 月ナビ */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
        }
        .nav-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 0 12px;
            color: #6c5ce7;
            line-height: 1;
            font-family: inherit;
        }
        .nav-btn:active { opacity: 0.5; }
        .month-title { font-size: 18px; font-weight: bold; color: #333; }

        /* カレンダー */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f8f8fc;
            border-bottom: 1px solid #eee;
        }
        .weekday {
            text-align: center;
            padding: 7px 0;
            font-size: 11px;
            font-weight: bold;
            color: #888;
        }
        .weekday:first-child { color: #e55; }
        .weekday:last-child  { color: #55e; }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #ddd;
        }

        .day-cell {
            background: white;
            min-height: 68px;
            padding: 3px;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(108,92,231,0.15);
            transition: background 0.1s;
            position: relative;
        }
        .day-cell:active { background: #f0ecff; }
        .day-cell.empty { background: #f8f8f8; cursor: default; pointer-events: none; }

        .day-num {
            font-size: 12px;
            font-weight: 500;
            color: #444;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1px;
        }
        .day-cell.sunday  .day-num { color: #e44; }
        .day-cell.saturday .day-num { color: #44d; }
        .day-cell.today .day-num {
            background: #6c5ce7;
            color: white !important;
        }

        .stamps-in-day {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
        }
        .stamp-entry {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stamp-emoji-display {
            font-size: 20px;
            line-height: 1.1;
        }
        .stamp-user-name {
            font-size: 8px;
            color: #aaa;
            text-align: center;
            max-width: 28px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stamp-entry.mine .stamp-emoji-display { cursor: pointer; }
        .stamp-entry.mine .stamp-emoji-display:active { transform: scale(1.4); }

        /* スタンプパレット（固定下部） */
        .stamp-palette {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: white;
            border-top: 2px solid #6c5ce7;
            padding: 8px 8px 10px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
            z-index: 50;
        }
        .mode-hint {
            text-align: center;
            font-size: 11px;
            color: #6c5ce7;
            font-weight: bold;
            margin-bottom: 6px;
            height: 14px;
        }
        .stamps-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 4px;
        }
        .stamp-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 5px 2px;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            background: none;
            font-family: inherit;
            min-width: 40px;
            transition: all 0.12s;
        }
        .stamp-btn:active { transform: scale(0.88); }
        .stamp-btn.selected {
            border-color: #6c5ce7;
            background: #f0ecff;
        }
        .stamp-btn-emoji { font-size: 22px; line-height: 1; }
        .stamp-btn-label { font-size: 9px; color: #777; }

        /* 下部スペーサー */
        .bottom-spacer { height: 130px; }

        /* セットアップモーダル */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 28px 24px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-icon { font-size: 48px; margin-bottom: 8px; }
        .modal h2 { font-size: 20px; color: #333; margin-bottom: 6px; }
        .modal p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }

        .modal-input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .modal-input:focus { outline: none; border-color: #6c5ce7; }
        .room-input { letter-spacing: 3px; text-transform: uppercase; }
        .code-input { font-size: 11px; letter-spacing: 0; word-break: break-all; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            font-family: inherit;
            transition: opacity 0.15s;
        }
        .btn:active { opacity: 0.75; }
        .btn-primary   { background: #6c5ce7; color: white; }
        .btn-secondary { background: #f0f0f5; color: #555; }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0 10px;
            color: #ccc;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        /* 削除確認ダイアログ */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .confirm-sheet {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .confirm-sheet p { font-size: 16px; margin-bottom: 16px; color: #333; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btns button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-delete { background: #ff7675; color: white; }
        .btn-cancel { background: #f0f0f5; color: #555; }

        /* 設定シート */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .settings-sheet {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 36px;
            width: 100%;
            max-width: 500px;
        }
        .settings-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .settings-label {
            font-size: 12px;
            color: #888;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .code-display {
            background: #f8f8fc;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 11px;
            word-break: break-all;
            color: #444;
            margin-bottom: 8px;
            font-family: monospace;
            text-align: center;
            line-height: 1.5;
        }
        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .settings-row input {
            flex: 1;
            padding: 11px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .settings-row input:focus { outline: none; border-color: #6c5ce7; }
        .settings-row .s-btn {
            padding: 11px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            background: #6c5ce7;
            color: white;
        }
        .settings-divider { height: 1px; background: #eee; margin: 16px 0; }

        /* トースト通知 */
        .toast {
            position: fixed;
            bottom: 145px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(50,50,50,0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 400;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* オフライン表示 */
        .offline-banner {
            background: #fdcb6e;
            color: #333;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <button class="settings-btn" onclick="openSettings()">設定 ⚙️</button>
    <h1>📅 スタンプカレンダー</h1>
    <div class="header-sub" id="roomDisplay">読み込み中...</div>
    <button class="share-btn" onclick="shareRoom()">共有 🔗</button>
</div>

<div class="offline-banner" id="offlineBanner">⚠️ オフライン中 — 変更は反映されません</div>

<div class="members-bar" id="membersBar"></div>

<div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
</div>

<div style="background:white;">
    <div class="weekdays">
        <div class="weekday">日</div>
        <div class="weekday">月</div>
        <div class="weekday">火</div>
        <div class="weekday">水</div>
        <div class="weekday">木</div>
        <div class="weekday">金</div>
        <div class="weekday">土</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
</div>

<div class="bottom-spacer"></div>

<!-- スタンプパレット -->
<div class="stamp-palette">
    <div class="mode-hint" id="modeHint">スタンプを選んで → 日付をタップ</div>
    <div class="stamps-row" id="stampRow1"></div>
    <div class="stamps-row" id="stampRow2"></div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<!-- セットアップモーダル -->
<div class="modal-overlay" id="setupModal">
    <div class="modal">
        <div class="modal-icon">📅</div>
        <h2>スタンプカレンダー</h2>
        <p>スタンプを押すだけで<br>スケジュールを共有できます</p>

        <input class="modal-input" id="nameInput" type="text" placeholder="あなたの名前（例：田中）" maxlength="10" autocomplete="nickname">

        <div class="divider">新しく始める</div>
        <button class="btn btn-primary" onclick="createRoom()">✨ 新しいルームを作る</button>

        <div class="divider">招待されている場合</div>
        <input class="modal-input room-input" id="roomInput" type="text" placeholder="ルームコード（例：ABC12）" maxlength="8">
        <button class="btn btn-secondary" onclick="joinRoom()">参加する →</button>

        <div class="divider">別のブラウザ・端末から引き継ぐ</div>
        <input class="modal-input code-input" id="personalCodeInput" type="text" placeholder="個人コードを貼り付け（設定からコピー）" autocomplete="off">
        <input class="modal-input room-input" id="restoreRoomInput" type="text" placeholder="ルームコード（例：ABC12）" maxlength="8">
        <button class="btn btn-secondary" onclick="restoreFromCode()">このコードで復元 →</button>
    </div>
</div>

<!-- 削除確認 -->
<div class="confirm-overlay" id="confirmOverlay" style="display:none">
    <div class="confirm-sheet">
        <p id="confirmText"></p>
        <div class="confirm-btns">
            <button class="btn-delete" id="confirmDeleteBtn">削除する</button>
            <button class="btn-cancel" onclick="closeConfirm()">キャンセル</button>
        </div>
    </div>
</div>

<!-- 設定シート -->
<div class="settings-overlay" id="settingsOverlay" style="display:none" onclick="closeSettingsIfBg(event)">
    <div class="settings-sheet">
        <div class="settings-title">⚙️ 設定</div>

        <div class="settings-label">🔑 個人コード（別のブラウザ・端末で使う場合）</div>
        <div class="code-display" id="personalCodeDisplay">—</div>
        <button class="btn btn-secondary" style="margin-bottom:0;" onclick="copyPersonalCode()">コードをコピー 📋</button>

        <div class="settings-divider"></div>

        <div class="settings-label">🚪 ルームを変更</div>
        <div class="settings-row">
            <input type="text" id="changeRoomInput" placeholder="ルームコード">
            <button class="s-btn" onclick="changeRoomTo()">移動</button>
        </div>
        <button class="btn btn-secondary" style="margin-bottom:0;" onclick="createNewRoom()">✨ 新しいルームを作る</button>

        <div class="settings-divider"></div>
        <button class="btn btn-secondary" style="margin-bottom:0;background:#fff0f0;color:#e44;" onclick="logoutConfirm()">👤 ユーザーをリセット</button>
    </div>
</div>

<script type="module">
import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, push, remove, onValue, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

// ============================================================
//  Firebase設定
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAS2og9fS_irKSFR0LmPtELjOlecE0Kn6w",
  authDomain: "stamp-calendar-3e7e0.firebaseapp.com",
  databaseURL: "https://stamp-calendar-3e7e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stamp-calendar-3e7e0",
  storageBucket: "stamp-calendar-3e7e0.firebasestorage.app",
  messagingSenderId: "913079675210",
  appId: "1:913079675210:web:c2a22f081e674ddbfcf9b3",
};
// ============================================================

// スタンプ一覧
const STAMPS = [
    { emoji: '🏠', label: '在宅'     },
    { emoji: '😴', label: '休み'     },
    { emoji: '❌', label: '不在'     },
    { emoji: '💼', label: '仕事朝'   },
    { emoji: '☀️', label: '仕事昼'   },
    { emoji: '🌙', label: '仕事夜'   },
    { emoji: '🎹', label: 'ピアノ'   },
    { emoji: '👶', label: '赤ちゃん' },
    { emoji: '🍺', label: '飲み会'   },
    { emoji: '🍷', label: 'ワイン'   },
];

// ---- アプリ状態 ----
let db, roomId, userName, userId;
let currentYear, currentMonth;
let selectedStamps = new Set();
let calendarData   = {};
let pendingDelete  = null;
let unsubStamps    = null;
let unsubUsers     = null;

// ---- Firebase 初期化 ----
function initFirebase() {
    try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        return true;
    } catch (e) {
        console.error(e);
        return false;
    }
}

// ---- ユーティリティ ----
function genId()       { return Math.random().toString(36).slice(2, 11); }
function genRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length: 5}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}
function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ---- 個人コード（ブラウザをまたいだ同一ユーザー識別） ----
function encodePersonalCode(name, uid) {
    try { return btoa(uid + ':' + encodeURIComponent(name)); }
    catch { return null; }
}
function decodePersonalCode(code) {
    try {
        const raw   = atob(code.trim().replace(/\s/g, ''));
        const colon = raw.indexOf(':');
        if (colon < 0) return null;
        const uid  = raw.slice(0, colon);
        const name = decodeURIComponent(raw.slice(colon + 1));
        if (!uid || !name) return null;
        return { uid, name };
    } catch { return null; }
}

// ---- セットアップ ----
function init() {
    const today  = new Date();
    currentYear  = today.getFullYear();
    currentMonth = today.getMonth();

    renderStampPalette();
    renderCalendar();

    const urlRoom = new URLSearchParams(location.search).get('room');
    if (urlRoom) {
        document.getElementById('roomInput').value        = urlRoom.toUpperCase();
        document.getElementById('restoreRoomInput').value = urlRoom.toUpperCase();
    }

    const savedName   = localStorage.getItem('sc_name');
    const savedRoom   = localStorage.getItem('sc_room');
    const savedUserId = localStorage.getItem('sc_uid');

    if (savedName) document.getElementById('nameInput').value = savedName;
    if (savedRoom && !urlRoom) {
        document.getElementById('roomInput').value        = savedRoom;
        document.getElementById('restoreRoomInput').value = savedRoom;
    }

    if (savedName && (savedRoom || urlRoom)) {
        userName = savedName;
        roomId   = urlRoom || savedRoom;
        userId   = savedUserId || genId();
        localStorage.setItem('sc_uid', userId);
        localStorage.setItem('sc_room', roomId);
        startApp();
    }
}

window.createRoom = function () {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { showToast('お名前を入力してください'); return; }
    userName = name;
    roomId   = genRoomCode();
    userId   = genId();
    save();
    startApp();
};

window.joinRoom = function () {
    const name = document.getElementById('nameInput').value.trim();
    const room = document.getElementById('roomInput').value.trim().toUpperCase();
    if (!name) { showToast('お名前を入力してください'); return; }
    if (!room) { showToast('ルームコードを入力してください'); return; }
    userName = name;
    roomId   = room;
    userId   = genId();
    save();
    startApp();
};

// 別ブラウザ・端末からの引き継ぎ
window.restoreFromCode = function () {
    const code = document.getElementById('personalCodeInput').value.trim();
    const room = document.getElementById('restoreRoomInput').value.trim().toUpperCase();
    if (!code) { showToast('個人コードを入力してください'); return; }
    if (!room) { showToast('ルームコードも入力してください'); return; }
    const decoded = decodePersonalCode(code);
    if (!decoded) { showToast('コードが正しくありません'); return; }
    userName = decoded.name;
    userId   = decoded.uid;
    roomId   = room;
    save();
    startApp();
};

function save() {
    localStorage.setItem('sc_name', userName);
    localStorage.setItem('sc_room', roomId);
    localStorage.setItem('sc_uid',  userId);
}

function startApp() {
    if (!initFirebase()) {
        showToast('Firebase設定が必要です');
        return;
    }
    document.getElementById('setupModal').style.display = 'none';
    updateRoomUI();

    const code = encodePersonalCode(userName, userId);
    document.getElementById('personalCodeDisplay').textContent = code || '—';

    subscribeToRoom();

    window.addEventListener('offline', () => document.getElementById('offlineBanner').style.display = 'block');
    window.addEventListener('online',  () => document.getElementById('offlineBanner').style.display = 'none');
}

function subscribeToRoom() {
    if (unsubStamps) { unsubStamps(); unsubStamps = null; }
    if (unsubUsers)  { unsubUsers();  unsubUsers  = null; }

    unsubStamps = onValue(ref(db, `rooms/${roomId}/stamps`), snap => {
        calendarData = snap.val() || {};
        renderCalendar();
    });
    unsubUsers = onValue(ref(db, `rooms/${roomId}/users`), snap => {
        renderMembers(snap.val() || {});
    });

    set(ref(db, `rooms/${roomId}/users/${userId}`), {
        name: userName,
        ts:   serverTimestamp()
    });
}

function updateRoomUI() {
    document.getElementById('roomDisplay').textContent = `ルーム: ${roomId}`;
    const url = new URL(location.href);
    url.searchParams.set('room', roomId);
    history.replaceState({}, '', url);
}

// ---- 設定シート ----
window.openSettings = function () {
    document.getElementById('settingsOverlay').style.display = 'flex';
};
window.closeSettings = function () {
    document.getElementById('settingsOverlay').style.display = 'none';
};
window.closeSettingsIfBg = function (e) {
    if (e.target === document.getElementById('settingsOverlay')) closeSettings();
};

window.copyPersonalCode = function () {
    const code = document.getElementById('personalCodeDisplay').textContent;
    if (!code || code === '—') { showToast('まずルームに参加してください'); return; }
    if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => showToast('個人コードをコピーしました！'));
    } else {
        prompt('個人コードをコピーしてください:', code);
    }
};

window.changeRoomTo = function () {
    const newRoom = document.getElementById('changeRoomInput').value.trim().toUpperCase();
    if (!newRoom) { showToast('ルームコードを入力してください'); return; }
    roomId = newRoom;
    calendarData = {};
    save();
    updateRoomUI();
    subscribeToRoom();
    closeSettings();
    renderCalendar();
    document.getElementById('changeRoomInput').value = '';
    showToast(`ルーム ${roomId} に移動しました`);
};

window.createNewRoom = function () {
    roomId = genRoomCode();
    calendarData = {};
    save();
    updateRoomUI();
    subscribeToRoom();
    closeSettings();
    renderCalendar();
    showToast(`新しいルーム ${roomId} を作りました`);
};

window.logoutConfirm = function () {
    if (confirm('ユーザー情報をリセットしますか？\n（次回は名前を入力し直す必要があります）')) {
        localStorage.clear();
        location.reload();
    }
};

// ---- 参加者バッジ ----
function renderMembers(users) {
    const bar = document.getElementById('membersBar');
    bar.innerHTML = Object.entries(users).map(([uid, u]) => {
        const isMe = uid === userId;
        return `<div class="member-badge ${isMe ? 'me' : ''}">${u.name}${isMe ? '（あなた）' : ''}</div>`;
    }).join('');
}

// ---- スタンプパレット ----
function renderStampPalette() {
    const half = Math.ceil(STAMPS.length / 2);
    ['stampRow1','stampRow2'].forEach((rowId, ri) => {
        document.getElementById(rowId).innerHTML =
            STAMPS.slice(ri * half, (ri+1) * half).map((s, i) => {
                const idx = ri * half + i;
                return `<button class="stamp-btn" id="sb${idx}" onclick="selectStamp(${idx})">
                    <span class="stamp-btn-emoji">${s.emoji}</span>
                    <span class="stamp-btn-label">${s.label}</span>
                </button>`;
            }).join('');
    });
}

// 複数選択：タップするたびにON/OFF切り替え
window.selectStamp = function(idx) {
    if (selectedStamps.has(idx)) {
        selectedStamps.delete(idx);
    } else {
        selectedStamps.add(idx);
    }
    document.querySelectorAll('.stamp-btn').forEach((btn, i) => {
        btn.classList.toggle('selected', selectedStamps.has(i));
    });
    updateModeHint();
};

function updateModeHint() {
    const hint = document.getElementById('modeHint');
    if (selectedStamps.size === 0) {
        hint.textContent = 'スタンプを選んで → 日付をタップ';
    } else if (selectedStamps.size === 1) {
        const idx = [...selectedStamps][0];
        hint.textContent = `「${STAMPS[idx].label}」を選択中 → 日付をタップ！`;
    } else {
        const emojis = [...selectedStamps].map(i => STAMPS[i].emoji).join(' ');
        hint.textContent = `${emojis} を選択中 → 日付をタップ！`;
    }
}

// ---- 月切替 ----
window.changeMonth = function(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth <  0) { currentMonth = 11; currentYear--; }
    renderCalendar();
};

// ---- カレンダー描画 ----
function renderCalendar() {
    document.getElementById('monthTitle').textContent = `${currentYear}年${currentMonth+1}月`;

    const grid     = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today    = new Date();

    for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell empty';
        grid.appendChild(cell);
    }

    for (let d = 1; d <= lastDate; d++) {
        const cell    = document.createElement('div');
        const dow     = (firstDay + d - 1) % 7;
        const key     = dateKey(currentYear, currentMonth, d);
        const isToday = (d === today.getDate() &&
                         currentMonth === today.getMonth() &&
                         currentYear  === today.getFullYear());

        let cls = 'day-cell';
        if (dow === 0) cls += ' sunday';
        if (dow === 6) cls += ' saturday';
        if (isToday)   cls += ' today';
        cell.className = cls;

        const num = document.createElement('div');
        num.className   = 'day-num';
        num.textContent = d;
        cell.appendChild(num);

        const stampsDiv = document.createElement('div');
        stampsDiv.className = 'stamps-in-day';

        const dayStamps = calendarData[key];
        if (dayStamps) {
            Object.entries(dayStamps).forEach(([sid, data]) => {
                const isMe  = data.userId === userId;
                const entry = document.createElement('div');
                entry.className = `stamp-entry${isMe ? ' mine' : ''}`;

                const emojiEl = document.createElement('div');
                emojiEl.className   = 'stamp-emoji-display';
                emojiEl.textContent = data.emoji;
                emojiEl.title       = `${data.userName}: ${data.label}`;

                if (isMe) {
                    emojiEl.addEventListener('click', e => {
                        e.stopPropagation();
                        openConfirm(key, sid, data);
                    });
                }

                const nameEl = document.createElement('div');
                nameEl.className   = 'stamp-user-name';
                nameEl.textContent = data.userName;

                entry.appendChild(emojiEl);
                entry.appendChild(nameEl);
                stampsDiv.appendChild(entry);
            });
        }

        cell.appendChild(stampsDiv);

        cell.addEventListener('click', () => {
            if (selectedStamps.size === 0) {
                showToast('下のスタンプを選んでください ▼');
                return;
            }
            addStamps(key);
        });

        grid.appendChild(cell);
    }
}

// ---- スタンプ追加（選択中の全スタンプをまとめて追加） ----
async function addStamps(key) {
    if (!db || selectedStamps.size === 0) return;
    const addedEmojis = [];
    for (const idx of selectedStamps) {
        const s      = STAMPS[idx];
        const newRef = push(ref(db, `rooms/${roomId}/stamps/${key}`));
        await set(newRef, {
            emoji:    s.emoji,
            label:    s.label,
            userId:   userId,
            userName: userName,
            ts:       Date.now()
        });
        addedEmojis.push(s.emoji);
    }
    const month = key.slice(5, 7);
    const day   = key.slice(8, 10);
    showToast(`${addedEmojis.join('')} ${parseInt(month)}/${parseInt(day)} に追加しました`);
}

// ---- スタンプ削除 ----
function openConfirm(key, sid, data) {
    pendingDelete = { key, sid };
    document.getElementById('confirmText').textContent = `${data.emoji} 「${data.label}」を削除しますか？`;
    document.getElementById('confirmOverlay').style.display = 'flex';
    document.getElementById('confirmDeleteBtn').onclick = doDelete;
}

async function doDelete() {
    if (!pendingDelete || !db) return;
    const { key, sid } = pendingDelete;
    await remove(ref(db, `rooms/${roomId}/stamps/${key}/${sid}`));
    showToast('削除しました');
    closeConfirm();
}

window.closeConfirm = function () {
    document.getElementById('confirmOverlay').style.display = 'none';
    pendingDelete = null;
};

// ---- 共有 ----
window.shareRoom = function () {
    const url = location.href;
    if (navigator.share) {
        navigator.share({
            title: 'スタンプカレンダー',
            text:  `ルームコード: ${roomId}\nスタンプカレンダーに参加しよう！`,
            url
        }).catch(() => {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        showToast('URLをコピーしました！');
    } else {
        prompt('このURLを共有してください:', url);
    }
};

// ---- トースト ----
let toastTimer;
window.showToast = function (msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
};

// ---- 起動 ----
init();
</script>
